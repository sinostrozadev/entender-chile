name: Estado de la Clave

# El estado del flujo de la Clave (CLAVE 4): un flujo por tema en
# contenido/claves/flujo/<slug>/, vista en contenido/estado/clave-<slug>.md.
# Igual que estado.yml para la cadena diaria, pero SEPARADO a propósito: la
# cadena diaria no se toca por construir esto (21-09).
#
# Con cada pieza o veredicto del flujo: recalcula la vista, la commitea, y
#   - en turno de GPT emite el evento al PR #6 en
#     contenido/estado/ultimo-evento-clave.txt (archivo propio, para no pisar el
#     dedup del flujo diario): pauta_aprobada, investigacion_lista,
#     entrega_lista, reparar_{investigacion,entrega,guion}. (El camino de la
#     idea, con sus etapas propias, se retiró el 04-11-2026.)
#   - en turno de Claude despierta a la rutina por API: validar_* (valida) y,
#     desde el 27-09, pautar y reparar_pauta (escribe la pauta). Mismo
#     mecanismo de marca y dedup, mismo endpoint /fire, distinto texto;
#   - en turno de SANTIAGO (pauta_lista) dispara el AVISO: la misma
#     rutina, que en MODO AVISADOR comprueba bitacora/bandeja.json y manda UNA
#     notificación push a su teléfono. Antes esta etapa no despertaba a
#     nadie y la Clave podía quedar días esperando sin que él lo supiera;
#   - en aprobada dispara la Edición diaria para la fecha de producción.
# reparar_pauta es de Claude y NO de GPT: por eso los reparar_ del turno de GPT
# van enumerados y no como reparar_*.
on:
  push:
    branches: [main]
    paths:
      - "contenido/claves/flujo/**"
      - "contenido/claves/*.md"
      - "contenido/guiones/claves/**"
      - "contenido/veredictos/clave-*"
  workflow_run:
    workflows: ["Edición diaria"]
    types: [completed]
  # Cada cuatro horas, para que la espera entre reintentos de los paneles (45
  # min) y el reintento del render tengan quien vuelva a mirar: sin un push
  # nuevo, nada más despierta a este workflow. El cron de GitHub llega tarde y
  # a horas al azar, y acá da igual: se trata de reintentar, no de ser puntual.
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: estado-clave
  cancel-in-progress: false

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calcular y commitear el estado de cada flujo abierto
        id: calc
        run: |
          git config user.name "estado-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -d contenido/claves/flujo ] || { echo "sin flujos"; echo "hay=0" >> "$GITHUB_OUTPUT"; exit 0; }
          for intento in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/estado-clave.js
            git add contenido/estado/clave-*.md contenido/estado/clave-*.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "sin cambios"; break; fi
            UTIL=$(git diff --cached -U0 -- contenido/estado/ | grep -E "^[+-][^+-]" | grep -vE "^[+-](ACTUALIZADO:|[[:space:]]*\"actualizado\":)" | wc -l)
            if [ "$UTIL" -eq 0 ]; then git reset -q; echo "solo cambió la marca de hora"; break; fi
            git commit -q -m "estado clave: $(ls contenido/estado/clave-*.md | xargs -n1 basename | sed 's/clave-//; s/\.md//' | tr '\n' ' ')[bot]"
            if git push -q origin main; then echo "estado commiteado (intento $intento)"; break; fi
            echo "push rechazado (intento $intento de 3)"
          done
          echo "hay=1" >> "$GITHUB_OUTPUT"

      # EL MURAL DE LA CLAVE SIN PASOS MANUALES (23-10-2026, scripts/mural-flujo.js).
      # La Clave de la semana tenía sus tres veredictos en APROBADA y nadie había
      # pedido los paneles, porque ese paso no existía: lo hacía Santiago a mano.
      # Este paso pide los paneles a GPT en tandas de diez (el tope por
      # solicitud) y, cuando están todos, los cose, los mide y deja mural.json.
      # No gasta ningún turno de Claude: la validación es por código.
      #
      # Se despacha pedido-gpt a mano además del push porque un push hecho con el
      # token del workflow no siempre dispara otro workflow, y un pedido que nadie
      # recoge es un día perdido sin aviso. pedido-gpt.yml deduplica por su cuenta.
      #
      # sharp se instala acá y no está en package.json: solo hace falta para medir
      # el color de entrega y para coser, o sea casi nunca.
      - name: Mural de la Clave (pedir los paneles a GPT, o coserlos si ya están)
        if: steps.calc.outputs.hay == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          grep -lE '^ETAPA: (paneles|armar_mural)$' contenido/estado/clave-*.md >/dev/null 2>&1 \
            || { echo "ningún flujo está en etapa de paneles"; exit 0; }
          npm install --no-save --no-audit --no-fund sharp@0.35.5 >/dev/null 2>&1 \
            || echo "::warning::no se pudo instalar sharp; sin él no se puede medir ni coser"
          RES=$(node scripts/mural-flujo.js paso) || { echo "::warning::mural-flujo.js falló"; exit 0; }
          echo "$RES"
          git config user.name "estado-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/urgente/ contenido/claves/flujo/ contenido/caratulas/claves/ public/claves/ 2>/dev/null || true
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          # algo cambió: la etapa también (paneles -> armar_mural -> aprobada), y el render
          # de más abajo la lee del estado commiteado
          node scripts/estado-clave.js
          git add contenido/estado/clave-*.md contenido/estado/clave-*.json 2>/dev/null || true
          git commit -q -m "mural de la Clave: $(echo "$RES" | head -1 | cut -c1-100) [bot]"
          for intento in 1 2 3; do
            git push -q origin main && break
            git fetch -q origin main && git rebase -q origin/main || break
          done
          if echo "$RES" | grep -q ': pidio '; then gh workflow run pedido-gpt.yml && echo "pedido-gpt despachado"; fi

      - name: Emitir eventos, despertar al validador, disparar el render
        if: steps.calc.outputs.hay == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION_ID: ${{ secrets.CLAUDE_RUTINA_REVISION_ID }}
          REVISION_TOKEN: ${{ secrets.CLAUDE_RUTINA_REVISION_TOKEN }}
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          for VISTA in contenido/estado/clave-*.md; do
            [ -f "$VISTA" ] || continue
            SLUG=$(grep -m1 '^SLUG:' "$VISTA" | cut -d' ' -f2-)
            ETAPA=$(grep -m1 '^ETAPA:' "$VISTA" | cut -d' ' -f2-)
            VUELTA=$(grep -m1 '^VUELTA:' "$VISTA" | cut -d' ' -f2-); VUELTA=${VUELTA:-0}
            FECHAP=$(grep -m1 '^FECHA_PRODUCCION:' "$VISTA" | cut -d' ' -f2- | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            echo "== $SLUG: $ETAPA (vuelta $VUELTA)"

            # --- turno de GPT: evento al PR #6 (archivo propio del flujo)
            if echo "$ETAPA" | grep -Eq '^(pauta_aprobada|investigacion_lista|entrega_lista|reparar_(investigacion|entrega|guion))$'; then
              EV=""; git fetch -q origin automatizacion/estado 2>/dev/null && EV=$(git show FETCH_HEAD:contenido/estado/ultimo-evento-clave.txt 2>/dev/null || echo "")
              if echo "$EV" | grep -q "^slug=$SLUG$" && echo "$EV" | grep -q "^etapa=$ETAPA$" && echo "$EV" | grep -q "^vuelta=$VUELTA$"; then
                echo "evento ya emitido"
              else
                git checkout -q -B automatizacion/estado origin/automatizacion/estado 2>/dev/null || git checkout -q -B automatizacion/estado origin/main
                {
                  echo "flujo=clave"; echo "slug=$SLUG"; echo "etapa=$ETAPA"; echo "vuelta=$VUELTA"
                  echo "pieza=$(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2- || true)"
                  echo "prompt=$(grep -m1 '^PROMPT:' "$VISTA" | cut -d' ' -f2- || true)"
                  echo "vista=$VISTA"; echo "emitido_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                } > contenido/estado/ultimo-evento-clave.txt
                git add contenido/estado/ultimo-evento-clave.txt
                git commit -q -m "evento clave $SLUG: $ETAPA (vuelta $VUELTA)"
                git push -q -f origin automatizacion/estado && echo "evento emitido al PR #6"
                git checkout -q main && git reset -q --hard origin/main
              fi
            fi

            # --- turno de Claude: disparo por API, una vez por etapa y vuelta.
            # Dos clases de turno con el MISMO mecanismo (marca, dedup y
            # endpoint /fire) y distinto texto: validar_* es el validador de
            # siempre; pautar y reparar_pauta son el PAUTADOR (27-09), que
            # escribe contenido/claves/flujo/<slug>/pauta.md con
            # prompts/pauta-clave.md. La rutina decide su rol leyendo los
            # archivos: este texto solo despierta.
            if echo "$ETAPA" | grep -Eq '^(validar_[a-z_]+|pautar|reparar_pauta)$' && [ -n "$REVISION_ID" ] && [ -n "$REVISION_TOKEN" ]; then
              case "$ETAPA" in
                pautar) QUE="etapa pautar: escribe la pauta con prompts/pauta-clave.md" ;;
                reparar_pauta) QUE="etapa reparar_pauta: escribe la pauta de nuevo con la nota de Santiago que apunta CORRECCIONES, con prompts/pauta-clave.md" ;;
                *) QUE="te toca validar la pieza $(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2-) contra su prompt" ;;
              esac
              # (01-11-2026) La marca lleva el commit de la pieza en juego, igual
              # que en estado.yml. Con solo "ETAPA VUELTA", el guion de la Clave
              # del 07-10 se reescribió en la misma vuelta, la marca calzó y
              # quedó cinco días en validar_guion vuelta 2 sin que nadie lo
              # validara. Pieza nueva, commit nuevo, disparo nuevo. La marca
              # vieja, sin hash, no calza: al estrenarse puede salir uno de más.
              ARCHIVO_P=$(grep -m1 '^ARCHIVO:' "$VISTA" | cut -d' ' -f2- || true)
              SHA_P=""
              [ -n "$ARCHIVO_P" ] && SHA_P=$(git log -1 --format=%h origin/main -- "$ARCHIVO_P" 2>/dev/null || true)
              FIRMA="$ETAPA $VUELTA ${SHA_P:-sin_pieza}"
              MARCA="contenido/estado/ultimo-disparo-claude-clave-$SLUG.txt"
              if [ "$(cat "$MARCA" 2>/dev/null)" = "$FIRMA" ]; then echo "Claude ya despertado para $ETAPA (pieza ${SHA_P:-sin_pieza})"; else
                echo "$FIRMA" > "$MARCA"; git add "$MARCA"; git commit -q -m "disparo a Claude, clave $SLUG: $ETAPA (vuelta $VUELTA, pieza ${SHA_P:-sin_pieza}) [bot]"; git push -q origin main || echo "::warning::marca no pusheada; se dispara igual"
                BODY=$(printf '{"text":"Entender Chile, flujo de la Clave %s: etapa %s, vuelta %s. %s. La verdad es contenido/estado/clave-%s.md."}' "$SLUG" "$ETAPA" "$VUELTA" "$QUE" "$SLUG")
                CODIGO=$(curl -sS -o /tmp/fire.json -w '%{http_code}' -X POST "https://api.anthropic.com/v1/claude_code/routines/$REVISION_ID/fire" \
                  -H "Authorization: Bearer $REVISION_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$BODY" || echo 000)
                case "$CODIGO" in 2*) echo "Claude despertado: $(head -c 200 /tmp/fire.json)";; *) echo "::warning::no se pudo despertar a Claude (HTTP $CODIGO)";; esac
              fi
            fi

            # --- turno de SANTIAGO: AVISO a su teléfono (27-09). pauta_lista
            # no la mueve nadie más que él, así que un flujo puede
            # quedarse ahí días sin que se note. Marca y dedup PROPIOS
            # (ultimo-aviso-<slug>.txt), para no pisar el disparo de Claude: las
            # dos cosas pueden ocurrir en la vida del mismo flujo. La rutina, en
            # MODO AVISADOR (prompts/validador.md), comprueba primero que el
            # ítem esté de verdad en bitacora/bandeja.json y solo entonces manda
            # la notificación: un aviso falso enseña a ignorar los avisos.
            # 12-11-2026: Claude aprueba su propia pauta, pauta_lista dura segundos y el aviso
            # a Santiago ya no se espera acá (el aviso con el veto sale al ELEGIR). Se deja
            # el bloque por si Santiago vuelve a aprobar él (clave.js aprobar sin --por claude).
            if echo "$ETAPA" | grep -Eq '^pauta_lista_con_aviso$' && [ -n "$REVISION_ID" ] && [ -n "$REVISION_TOKEN" ]; then
              PIEZA_ESPERA=$(echo "$ETAPA" | cut -d_ -f1)
              MARCA_A="contenido/estado/ultimo-aviso-$SLUG.txt"
              if [ "$(cat "$MARCA_A" 2>/dev/null)" = "$ETAPA $VUELTA" ]; then echo "aviso ya enviado para $ETAPA (vuelta $VUELTA)"; else
                echo "$ETAPA $VUELTA" > "$MARCA_A"; git add "$MARCA_A"; git commit -q -m "aviso a Santiago, clave $SLUG: $ETAPA (vuelta $VUELTA) [bot]"; git push -q origin main || echo "::warning::marca del aviso no pusheada; se avisa igual"
                BODY=$(printf '{"text":"AVISO a Santiago: la Clave %s espera su decision. La %s esta escrita y la etapa es %s; hasta que apruebe o pida cambios, nadie mas puede mover el flujo. Estas en MODO AVISADOR (prompts/validador.md, punto 0): comprueba bitacora/bandeja.json y manda UNA notificacion push."}' "$SLUG" "$PIEZA_ESPERA" "$ETAPA")
                CODIGO=$(curl -sS -o /tmp/fire-a.json -w '%{http_code}' -X POST "https://api.anthropic.com/v1/claude_code/routines/$REVISION_ID/fire" \
                  -H "Authorization: Bearer $REVISION_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$BODY" || echo 000)
                case "$CODIGO" in 2*) echo "AVISO disparado: $(head -c 200 /tmp/fire-a.json)";; *) echo "::warning::no se pudo disparar el aviso (HTTP $CODIGO); el Taller y el informe de la mañana lo muestran igual";; esac
              fi
            fi

            # --- PLAN B (26-09): sin GPT, el suplente hace su turno también aquí.
            # Los turnos salen de la línea `turnos:` de plan-b.txt (misma lista
            # que estado.yml; el * es comodín).
            PLANB=$(grep -m1 '^hasta:' contenido/estado/plan-b.txt 2>/dev/null | cut -d' ' -f2- || true)
            TURNOS=$(grep -m1 '^turnos:' contenido/estado/plan-b.txt 2>/dev/null | cut -d' ' -f2- || true)
            RE_T="^($(echo "$TURNOS" | sed 's/\*/[a-z_]+/g; s/  */|/g'))$"
            HOYC=$(TZ=America/Santiago date +%F)
            if [ -n "$PLANB" ] && [ -n "$TURNOS" ] && [ "$PLANB" \> "$HOYC" -o "$PLANB" = "$HOYC" ] && echo "$ETAPA" | grep -Eq "$RE_T" && [ -n "$REVISION_ID" ] && [ -n "$REVISION_TOKEN" ]; then
              MARCA_S="contenido/estado/ultimo-disparo-suplente-clave-$SLUG.txt"
              if [ "$(cat "$MARCA_S" 2>/dev/null)" = "$ETAPA $VUELTA" ]; then echo "suplente ya despertado"; else
                echo "$ETAPA $VUELTA" > "$MARCA_S"; git add "$MARCA_S"; git commit -q -m "disparo al suplente, clave $SLUG: $ETAPA (vuelta $VUELTA) [bot]"; git push -q origin main || true
                BODY=$(printf '{"text":"Entender Chile, PLAN B (GPT sin cuota): flujo de la Clave %s, etapa %s, vuelta %s. Haz el turno de GPT como SUPLENTE segun prompts/suplente.md. La verdad es contenido/estado/clave-%s.md."}' "$SLUG" "$ETAPA" "$VUELTA" "$SLUG")
                CODIGO=$(curl -sS -o /tmp/fire-s.json -w '%{http_code}' -X POST "https://api.anthropic.com/v1/claude_code/routines/$REVISION_ID/fire" \
                  -H "Authorization: Bearer $REVISION_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$BODY" || echo 000)
                case "$CODIGO" in 2*) echo "SUPLENTE despertado: $(head -c 200 /tmp/fire-s.json)";; *) echo "::warning::no se pudo despertar al suplente (HTTP $CODIGO)";; esac
              fi
            fi

            # --- aprobada: render y subida de la Clave para su fecha de producción
            if [ "$ETAPA" = "aprobada" ] && [ -n "$FECHAP" ]; then
              MARCA="contenido/estado/ultimo-render-clave-$SLUG.txt"
              # La marca era solo la fecha, y por eso un render que FALLÓ no se reintentaba
              # nunca: el 16-10-2026 el gate rechazó la Clave por un error de selección de
              # archivo, la marca quedó puesta, y la Clave esperó siete días sin que nada
              # volviera a intentarlo. Ahora guarda fecha, intentos y hora, y se reintenta
              # pasadas tres horas (más que un render normal), hasta tres veces. Si la Clave
              # sigue en "aprobada" es que no hay video: el estado pasa a videos_listos
              # apenas existe su descripción, y ahí los reintentos terminan solos.
              read -r M_FECHA M_INT M_EPOCH < "$MARCA" 2>/dev/null || true
              [ "$M_FECHA" = "$FECHAP" ] || M_INT=0
              M_INT=${M_INT:-0}; M_EPOCH=${M_EPOCH:-0}; AHORA_E=$(date +%s)
              if [ "$M_FECHA" = "$FECHAP" ] && { [ "$M_INT" -ge 3 ] || [ $((AHORA_E - M_EPOCH)) -lt 10800 ]; }; then
                [ "$M_INT" -ge 3 ] && echo "::warning::el render de $SLUG se disparó 3 veces y no hay video: hay que mirarlo a mano" || echo "render ya disparado (intento $M_INT), se reintenta pasadas 3 h"
              else
                echo "$FECHAP $((M_INT + 1)) $AHORA_E" > "$MARCA"; git add "$MARCA"; git commit -q -m "render de la Clave $SLUG disparado para $FECHAP (intento $((M_INT + 1))) [bot]"; git push -q origin main || true
                gh workflow run edicion-diaria.yml -f fecha="$FECHAP" && echo "Edición diaria disparada para $FECHAP"
              fi
            fi
          done

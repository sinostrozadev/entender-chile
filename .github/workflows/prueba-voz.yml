name: Prueba de voz

# La muestra del informe CON VOZ REAL, para escuchar la entrada hablada de
# cada sección ("Ahora, temporal en el centro sur") antes de que entre a una
# edición al aire. Nace el 27-09-2026, cuando Santiago pidió que el locutor
# anuncie el cambio de sección: eso cambia lo que se DICE, no solo lo que se
# ve, así que no puede probarse con el audio viejo de una edición publicada.
#
# Por qué un workflow y no la sesión de día: la voz vive en los secrets de
# Azure, que están acá. Y por qué a mano y no en cron: cada corrida gasta unos
# 11.000 caracteres del cupo mensual de 500.000, algo más del 2%.
#
# NO TOCA NINGUNA EDICIÓN: no commitea nada. Escribe en out/ y en
# contenido/descripciones/ (dia.js lo hace siempre), pero como no hay push,
# el repo queda igual. Deja el mp4 en el release `prueba-voz`, que se pisa en
# cada corrida. Rinde el informe ENTERO, unos 25 minutos de render: no hay
# muestra corta con voz, porque la alineación corta sale de la larga.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de un informe ya escrito (AAAA-MM-DD)"
        required: true
      entrada:
        description: "1 = con la entrada hablada por sección; vacío = como suena hoy"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: prueba-voz
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm ci || npm install
      - name: Rendir la muestra con voz
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
          ENTRADA_VOZ: ${{ inputs.entrada }}
          SECUENCIA: "2409"
          FECHA_EDICION: ${{ inputs.fecha }}
          REMOTION_FUENTES_LOCALES: "1"
        run: |
          GUION="contenido/guiones/informe/${{ inputs.fecha }}.md"
          [ -f "$GUION" ] || { echo "::error::no existe $GUION"; exit 1; }
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "::error::sin AZURE_SPEECH_KEY: esta prueba no tiene sentido muda"; exit 1; fi
          node scripts/dia.js "$GUION" --voz --render
      - name: Dejar el video donde se pueda ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls out/${{ inputs.fecha }}/*.mp4 | head -1)
          [ -n "$F" ] || { echo "::error::el render no dejó mp4"; exit 1; }
          if [ "${{ inputs.entrada }}" = "1" ]; then SUFIJO=con-entrada; else SUFIJO=como-hoy; fi
          DEST="out/prueba-voz-${{ inputs.fecha }}-$SUFIJO.mp4"
          cp "$F" "$DEST"
          gh release delete prueba-voz --yes --cleanup-tag 2>/dev/null || true
          gh release create prueba-voz "$DEST" --title "Prueba de voz" \
            --notes "Muestra con voz real para escuchar la entrada hablada por sección. Se pisa en cada corrida."
          echo "listo: $(gh release view prueba-voz --json url --jq .url)"

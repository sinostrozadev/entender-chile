name: Edición diaria

# EL TIMBRE, NO EL DESPERTADOR (29-08-2026): el render se dispara cuando
# llega la revisión de calidad (~04:43 Chile), que es la última pieza antes
# de renderizar. Así la cadena queda encadenada por artefactos y no por
# relojes: informe → guion → revisión → render. El cron de GitHub demostró
# atrasos de 10 horas y un día no corrió (28-08: cero videos con la edición
# lista); queda solo de red de seguridad, y el gate ya tolera revisión
# ausente. Lo disparado por push funciona 30 de 30.
#
# El timbre lo toca la ÚLTIMA de las dos piezas que necesita el render: el
# guion del informe y la revisión. Si llega una sin la otra, esa corrida
# termina en verde sin hacer nada y la otra pieza vuelve a tocar (paso 0b).
# 29-08: la revisión llegó 04:41 y el guion 09:04 → el gate falló en rojo
# sin culpa y hubo que esperar al cron de respaldo (10:04).
on:
  push:
    branches: [main]
    paths:
      - "contenido/revisiones/**"
      - "contenido/guiones/informe/**"
      # Un guion de Clave que llega tarde toca su propio timbre (02-09-2026:
      # la Clave quedó escrita a las 07:22 y no había forma de producirla).
      - "contenido/guiones/claves/**"
  schedule:
    # respaldo: 09:00 UTC = 05:00 Chile en invierno / 06:00 en verano.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Edición a producir (AAAA-MM-DD). Vacío = hoy en Chile."
        required: false
        default: ""
      forzar:
        description: "Rehacer piezas que YA están en el release (para corregir un defecto). Vacío = no."
        required: false
        default: ""

concurrency:
  group: edicion-diaria
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para despachar el workflow Web al final

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La fecha se fija UNA sola vez: si el job cruza la medianoche, todos
      # los pasos y scripts siguen hablando de la misma edición.
      - name: Fijar fecha de la edición
        run: |
          FECHA="${{ github.event.inputs.fecha }}"
          [ -n "$FECHA" ] || FECHA=$(TZ=America/Santiago date +%F)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          echo "FECHA_EDICION=$FECHA" >> "$GITHUB_ENV"
          echo "Edición del $FECHA"

      # REENTRANTE POR PIEZA (02-09-2026): el release del día es la memoria de
      # qué ya se produjo. Cada pieza (informe, Short, Clave, Short de la Clave)
      # se salta solo si su .mp4 ya está ahí, así el workflow se puede relanzar
      # cuando sea y produce únicamente lo que falta. Antes preguntaba solo por
      # el informe y saltaba todo: una Clave atrasada no tenía cómo rescatarse.
      # Las subidas (7, 7b) ya eran seguras: solo suben lo que esta corrida
      # dejó en out/ y public/.
      - name: 0 · ¿Qué piezas ya están en el release? (reentrante, por pieza)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "edicion-$FECHA" --json assets -q '.assets[].name' 2>/dev/null || true)
          # forzar: se rehacen todas las piezas aunque ya estén en el release.
          # Se usa para reemplazar una pieza publicada con un defecto (02-09:
          # el texto desbordado del BUG 1). Las subidas a YouTube crean videos
          # NUEVOS: los viejos hay que borrarlos a mano en Studio.
          FORZAR="${{ github.event.inputs.forzar }}"
          if [ -n "$FORZAR" ]; then
            echo "FORZAR=1: se rehacen todas las piezas del $FECHA aunque estén en el release."
            ASSETS=""
          fi
          tiene() { echo "$ASSETS" | grep -qxF "$FECHA-$1.mp4"; }
          tiene informe     && echo "HAY_INFORME=1"     >> "$GITHUB_ENV"
          tiene short       && echo "HAY_SHORT=1"       >> "$GITHUB_ENV"
          tiene clave       && echo "HAY_CLAVE=1"       >> "$GITHUB_ENV"
          FALTA=""
          tiene informe || FALTA="$FALTA informe"
          tiene short   || FALTA="$FALTA short"
          # La Clave solo cuenta como pendiente si hoy existe su guion.
          # (Su Short se retiró el 16-09: ver CLAVE 3 en bitacora/PENDIENTES.md.)
          if ls contenido/guiones/claves/$FECHA-*.md >/dev/null 2>&1; then
            tiene clave || FALTA="$FALTA clave"
          fi
          if [ -z "$FALTA" ]; then
            echo "SALTAR=1" >> "$GITHUB_ENV"
            echo "El release edicion-$FECHA ya tiene todas las piezas posibles; esta ejecución no hace nada."
          else
            echo "Piezas por producir:$FALTA"
          fi

      # Solo cuando dispara un push: si falta el guion o la revisión, no es
      # un error, es que todavía no llega la otra pieza. Con el cron o a mano
      # no se espera a nadie: decide el gate del paso 2b.
      - name: 0b · ¿Están las dos piezas? (solo por push)
        if: github.event_name == 'push' && env.SALTAR != '1'
        run: |
          G="contenido/guiones/informe/$FECHA.md"; R="contenido/revisiones/$FECHA.md"
          [ -f "$G" ] || { echo "SALTAR=1" >> "$GITHUB_ENV"; echo "Todavía no llega el guion del informe ($G): se espera a que su push toque el timbre."; }
          [ -f "$R" ] || { echo "SALTAR=1" >> "$GITHUB_ENV"; echo "Todavía no llega la revisión ($R): se espera a su push (o al cron de respaldo, que no espera)."; }

      # La edición la escribe ChatGPT de madrugada y la pushea al repo. NO hay
      # plan B: si a esta hora no llegó, el gate del paso 2b falla y la edición
      # del día no se renderiza. Ver archivo/revisar/README.md (generar.js retirado).

      # Sin ANTHROPIC_API_KEY solo regenera el índice y detecta las marcas
      # EN SEGUIMIENTO del informe; las novedades de cada dossier las trae la
      # rutina de Claude en la nube de las 03:00.
      - name: 1b · Observatorio de casos (índice y casos nuevos; no bloquea la edición)
        continue-on-error: true
        if: env.SALTAR != '1'
        run: node scripts/casos.js

      - name: 2 · Commit de los textos (antes de renderizar, por si el render falla)
        if: env.SALTAR != '1'
        run: |
          git config user.name "edicion-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/
          git diff --cached --quiet || {
            git commit -m "edición $FECHA [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

      - name: 2b · Gate previo al render (edición renderizable y no rechazada)
        if: env.SALTAR != '1'
        run: node scripts/gate.js

      # Cuenta tarjetas por tipo y avisa si se rompe una cuota de variedad o
      # hay una marca malformada. Solo informa en el log: no bloquea el video.
      - name: 2c · Variedad de tarjetas (contador; avisa, no bloquea)
        if: env.SALTAR != '1'
        run: |
          node scripts/numerales.js   # autoprueba del conversor de cifras: si falla, la pantalla mentiría
          node scripts/validar-tarjetas.js --fecha "$FECHA" || true
          for g in contenido/guiones/claves/"$FECHA"-*.md; do [ -f "$g" ] && node scripts/validar-tarjetas.js "$g" || true; done

      - name: 3 · Producir video del informe (voz si hay secrets; si no, mudo)
        # La voz es solo Azure desde el 26-09-2026: ELEVENLABS_API_KEY y
        # VOICE_ID salieron de este paso y del 4 el 01-11-2026. Con ellos en la
        # condición, un secret viejo de ElevenLabs podía pedir --voz sin Azure
        # y la edición se caía en dia.js en vez de salir muda.
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
          # (27-09) la secuencia aprobada el 24-09 (imagen de sección toda la
          # sección, oscurecida, texto encima) entra a producción por decisión
          # de Santiago tras ver el video de prueba. Vacío = montaje anterior.
          SECUENCIA: "2409"
          # (12-10) TEXTO_BLOQUES: el párrafo narrado deja de salir entero y se
          # releva en bloques de ocho o nueve palabras al ritmo de la voz, como
          # en la Clave del mural. Decisión de Santiago: "el texto se reemplaza,
          # no se acumula", porque un párrafo entero obliga a leer a nuestra
          # velocidad y el espectador siempre va atrasado. Cómo se corta, en
          # scripts/texto-bloques.js. Vacío = el párrafo entero de antes.
          TEXTO_BLOQUES: "1"
          # (28-09) El formato completo entra al aire, aprobado por Santiago
          # viendo la muestra con voz real: "quiero que el video del informe de
          # mas rato salga con este formato".
          #
          # ENTRADA_VOZ: el locutor lee el titular de cada seccion antes de
          # entrar. No es adorno: es lo que le da tiempo a la cabecera, que sin
          # esto no alcanzaba a mostrarse (el informe del 27-09 salio sin un
          # solo titulo en pantalla).
          #
          # FONDO_MOSAICO: el salon con el nombre del canal detras del mosaico,
          # en vez del negro liso. Vale "aire" para la otra imagen o vacio para
          # volver al negro.
          #
          # ENTRADA_MARCA (01-10): la portada del canal y la apertura pasan a ser
          # un solo movimiento, y de paso saca el mosaico de presentacion que
          # habia entre el inicio y la apertura. Aprobado por Santiago viendo la
          # muestra sobre este mismo montaje: "si me gusta, sube ese cambio, que
          # manana salga de esa forma".
          ENTRADA_VOZ: "1"
          FONDO_MOSAICO: "sala"
          ENTRADA_MARCA: "1"
        if: env.SALTAR != '1' && env.HAY_INFORME != '1'
        run: |
          if [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; then VOZ="--voz"; else VOZ=""; echo "Sin secrets de voz: video mudo de prueba."; fi
          node scripts/dia.js $VOZ --render

      # El Short del informe: cinco tesis del guion en vertical (scripts/short.js).
      # Va AQUÍ, antes de la Clave, porque dia.js escribe informe y Clave en la
      # misma carpeta out/FECHA/ y la Clave pisaría el parsed.json del informe.
      # Render corto (~2 min). Si falla, la edición sigue: no bloquea.
      - name: 3b · Producir el Short del informe (cinco cosas que hay que saber)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
        # Necesita el parsed.json que deja el paso 3 en la misma corrida.
        if: env.SALTAR != '1' && env.HAY_INFORME != '1' && env.HAY_SHORT != '1'
        continue-on-error: true
        run: node scripts/short.js --fecha "$FECHA" --voz --render

      # EL DIARIO COMO ESCENARIO (02-11-2026, "Entender el caso"). Si el guion
      # de la Clave trae marcas [DIARIO ...], scripts/diario-captura.js dibuja
      # la página de cada fecha desde web/dist, y en Actions web/ no está
      # instalada ni construida: sin este paso el largo no tendría páginas.
      # Se instala y construye igual que en web.yml (la compilación para
      # entender.sinodev.cl, con base /), y solo cuando hace falta: son un par
      # de minutos que una Clave sin marcas no tiene por qué pagar.
      - name: Dependencias de la web (solo si la Clave usa el diario)
        if: env.SALTAR != '1' && env.HAY_CLAVE != '1' && env.SIN_CLAVE != '1'
        env:
          WEB_SITE: https://entender.sinodev.cl
          WEB_BASE: /
        run: |
          if ls contenido/guiones/claves/$FECHA-*.md 2>/dev/null | grep -v -- '-imagenes\.md$' | xargs -r grep -l '^\[DIARIO' >/dev/null; then
            cd web && npm ci && npm run build
          else
            echo "La Clave de hoy no trae marcas DIARIO: no hace falta la web."
          fi

      - name: 4 · Producir video de la Clave (si hubo)
        env:
          # EL MURAL (12-10-2026): la Clave sale con el mural cuando su carpeta
          # trae contenido/claves/flujo/<slug>/mural.json, y con el formato
          # clásico si no lo trae. "mural" hace además que un mural que no calza
          # con su guion detenga el paso en vez de salir con el formato viejo.
          # Para volver atrás: "clasico". El detalle está en scripts/dia.js.
          CLAVE_FORMATO: mural
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
        if: env.SALTAR != '1' && env.HAY_CLAVE != '1' && env.SIN_CLAVE != '1'
        run: |
          if [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; then VOZ="--voz"; else VOZ=""; fi
          node scripts/dia.js --clave --si-existe $VOZ --render

      - name: 5 · Commit de las descripciones
        if: env.SALTAR != '1'
        run: |
          git add contenido/descripciones/ || true
          git diff --cached --quiet || {
            git commit -m "descripciones $FECHA [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

      - name: 6 · Publicar videos como release del día
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.SALTAR != '1'
        run: |
          TAG="edicion-$FECHA"
          NOTAS="contenido/descripciones/$FECHA-informe.txt"
          [ -f "$NOTAS" ] || { echo "(sin descripción, release con notas mínimas)"; echo "Edición $FECHA" > "$NOTAS"; }
          # Un fallo de `create` NO significa "ya existía". El 13-09 fue un HTTP 500
          # de GitHub: la línea de antes lo dio por duplicado, el `upload` falló con
          # "release not found" y los cuatro videos quedaron renderizados y sin
          # publicar seis horas (RELEASE 1). Ahora se comprueba con `release view`
          # y se reintenta hasta tres veces antes de subir.
          for intento in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "el release $TAG existe"; break; fi
            gh release create "$TAG" --title "Edición $FECHA" --notes-file "$NOTAS" && break
            echo "create del release falló (intento $intento de 3); reintento en 20 s"
            sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "::error::el release $TAG no existe tras tres intentos: los videos quedaron renderizados y SIN publicar"; exit 1; }
          gh release upload "$TAG" out/$FECHA/*.mp4 --clobber
          # las tres carátulas (la que salió y las dos alternativas) para la
          # prueba A/B de YouTube Studio, que se carga a mano (20-09)
          if ls out/$FECHA/miniatura*.png >/dev/null 2>&1; then gh release upload "$TAG" out/$FECHA/miniatura*.png --clobber; fi
          if ls public/$FECHA-*.mp3 >/dev/null 2>&1; then gh release upload "$TAG" public/$FECHA-*.mp3 --clobber; fi

      # Sube las piezas del día a YouTube PROGRAMADAS si existen los tres
      # secrets (docs/youtube.md). Sin secrets no hace nada y no falla. La
      # ventana entre la subida y la hora de publicación es la revisión.
      - name: 7 · Subir a YouTube (programado; solo si hay secrets)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Hora de Chile de publicación por pieza (variables del repo, Settings →
          # Variables; si no existen, valen estos defaults). Desde el 15-09 los
          # videos suben PROGRAMADOS, no privados. La Clave pasó de las 14:00 a
          # las 19:00 el 01-11-2026 (regla 19): ahora es el largo por tema, que
          # se ve de tarde, y no la pieza del mediodía.
          YT_HORA_INFORME: ${{ vars.YT_HORA_INFORME || '06:30' }}
          YT_HORA_SHORT: ${{ vars.YT_HORA_SHORT || '12:00' }}
          YT_HORA_CLAVE: ${{ vars.YT_HORA_CLAVE || '19:00' }}
          # Mínimo de minutos entre la subida y la publicación: la ventana de
          # revisión de Santiago. Si la hora de arriba queda más cerca, se corre.
          YT_MARGEN_MIN: ${{ vars.YT_MARGEN_MIN || '90' }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: |
          # youtube-subir.js sale con 1 si falta el archivo, y eso abortaría el
          # bloque antes de llegar a la Clave: cada pieza sube solo si esta
          # corrida la renderizó.
          # PROGRAMADO, no privado (Santiago, 15-09: "quiero ver si eso funciona").
          # Hora de Chile por pieza; se cambia con las variables de repositorio
          # YT_HORA_INFORME, YT_HORA_SHORT y YT_HORA_CLAVE sin tocar este
          # archivo. Si la hora pedida deja menos de YT_MARGEN_MIN minutos de
          # revisión, el script la corre. Si YouTube rechaza publishAt, el
          # script falla y el video no sube: mirar el log.
          if [ -f "out/$FECHA/$FECHA-informe.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --programar "$YT_HORA_INFORME"; fi
          if [ -f "out/$FECHA/$FECHA-short.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --short --programar "$YT_HORA_SHORT"; fi
          if [ -f "out/$FECHA/$FECHA-clave.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --clave --programar "$YT_HORA_CLAVE"; fi

      # El informe como episodio de podcast (Spotify y compañía leen el RSS solos).
      # Necesita el secret AUDIO_TOKEN (PAT fino con contents:write sobre
      # entender-chile-web); sin él, avisa y sigue.
      - name: 7b · Episodio del podcast (si hay AUDIO_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.AUDIO_TOKEN }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Sin AUDIO_TOKEN: no hay episodio de podcast."; exit 0; fi
          node scripts/podcast-subir.js --fecha "$FECHA"
          if [ -f "public/$FECHA-clave.mp3" ]; then node scripts/podcast-subir.js --fecha "$FECHA" --clave; fi
          git config user.name "edicion-bot"; git config user.email "bot@users.noreply.github.com"
          git add contenido/podcast/ || true
          git diff --cached --quiet || {
            git commit -m "podcast $FECHA [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

      # Los pushes hechos con el token del workflow NO disparan otros workflows
      # (regla anti-recursión de GitHub): el feed del podcast quedaba viejo
      # (hallazgo de la sesión de día, 31-08). Se despacha la web a mano.
      - name: 8 · Reconstruir la web (los pushes del bot no disparan workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: gh workflow run web.yml --ref main

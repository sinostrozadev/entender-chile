name: Edición diaria

# EL TIMBRE, NO EL DESPERTADOR (29-08-2026): el render se dispara cuando
# llega la revisión de calidad (~04:43 Chile), que es la última pieza antes
# de renderizar. Así la cadena queda encadenada por artefactos y no por
# relojes: informe → guion → revisión → render. El cron de GitHub demostró
# atrasos de 10 horas y un día no corrió (28-08: cero videos con la edición
# lista); queda solo de red de seguridad, y el gate ya tolera revisión
# ausente. Lo disparado por push funciona 30 de 30.
#
# El timbre lo toca la ÚLTIMA de las dos piezas que necesita el render: el
# guion del informe y la revisión. Si llega una sin la otra, esa corrida
# termina en verde sin hacer nada y la otra pieza vuelve a tocar (paso 0b).
# 29-08: la revisión llegó 04:41 y el guion 09:04 → el gate falló en rojo
# sin culpa y hubo que esperar al cron de respaldo (10:04).
on:
  push:
    branches: [main]
    paths:
      - "contenido/revisiones/**"
      - "contenido/guiones/informe/**"
  schedule:
    # respaldo: 09:00 UTC = 05:00 Chile en invierno / 06:00 en verano.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: edicion-diaria
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para despachar el workflow Web al final

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La fecha se fija UNA sola vez: si el job cruza la medianoche, todos
      # los pasos y scripts siguen hablando de la misma edición.
      - name: Fijar fecha de la edición
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          echo "FECHA_EDICION=$FECHA" >> "$GITHUB_ENV"
          echo "Edición del $FECHA"

      # Si el timbre y el despertador suenan el mismo día, el segundo no debe
      # repetir 40 minutos de render: si el release del día ya tiene el video
      # del informe, no hay nada que hacer.
      - name: 0 · ¿Ya hay video hoy?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "edicion-$FECHA" --json assets -q '.assets[].name' 2>/dev/null | grep -q "informe.mp4"; then
            echo "SALTAR=1" >> "$GITHUB_ENV"
            echo "El release edicion-$FECHA ya tiene el video del informe; esta ejecución no hace nada."
          fi

      # Solo cuando dispara un push: si falta el guion o la revisión, no es
      # un error, es que todavía no llega la otra pieza. Con el cron o a mano
      # no se espera a nadie: decide el gate del paso 2b.
      - name: 0b · ¿Están las dos piezas? (solo por push)
        if: github.event_name == 'push' && env.SALTAR != '1'
        run: |
          G="contenido/guiones/informe/$FECHA.md"; R="contenido/revisiones/$FECHA.md"
          [ -f "$G" ] || { echo "SALTAR=1" >> "$GITHUB_ENV"; echo "Todavía no llega el guion del informe ($G): se espera a que su push toque el timbre."; }
          [ -f "$R" ] || { echo "SALTAR=1" >> "$GITHUB_ENV"; echo "Todavía no llega la revisión ($R): se espera a su push (o al cron de respaldo, que no espera)."; }

      # La edición la escribe ChatGPT de madrugada y la pushea al repo. NO hay
      # plan B: si a esta hora no llegó, el gate del paso 2b falla y la edición
      # del día no se renderiza. Ver revisar/README.md (generar.js retirado).

      # Sin ANTHROPIC_API_KEY solo regenera el índice y detecta las marcas
      # EN SEGUIMIENTO del informe; las novedades de cada dossier las trae la
      # rutina de Claude en la nube de las 03:00.
      - name: 1b · Observatorio de casos (índice y casos nuevos; no bloquea la edición)
        continue-on-error: true
        if: env.SALTAR != '1'
        run: node scripts/casos.js

      - name: 2 · Commit de los textos (antes de renderizar, por si el render falla)
        if: env.SALTAR != '1'
        run: |
          git config user.name "edicion-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/
          git diff --cached --quiet || { git commit -m "edición $FECHA [bot]"; git push; }

      - name: 2b · Gate previo al render (edición renderizable y no rechazada)
        if: env.SALTAR != '1'
        run: node scripts/gate.js

      - name: 3 · Producir video del informe (voz si hay secrets; si no, mudo)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}
        if: env.SALTAR != '1'
        run: |
          if { [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; } || { [ -n "$ELEVENLABS_API_KEY" ] && [ -n "$VOICE_ID" ]; }; then VOZ="--voz"; else VOZ=""; echo "Sin secrets de voz: video mudo de prueba."; fi
          node scripts/dia.js $VOZ --render

      # El Short del informe: cinco tesis del guion en vertical (scripts/short.js).
      # Va AQUÍ, antes de la Clave, porque dia.js escribe informe y Clave en la
      # misma carpeta out/FECHA/ y la Clave pisaría el parsed.json del informe.
      # Render corto (~2 min). Si falla, la edición sigue: no bloquea.
      - name: 3b · Producir el Short del informe (cinco cosas que hay que saber)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: node scripts/short.js --fecha "$FECHA" --voz --render

      - name: 4 · Producir video de la Clave (si hubo)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}
        if: env.SALTAR != '1'
        run: |
          if { [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; } || { [ -n "$ELEVENLABS_API_KEY" ] && [ -n "$VOICE_ID" ]; }; then VOZ="--voz"; else VOZ=""; fi
          node scripts/dia.js --clave --si-existe $VOZ --render

      - name: 4b · Producir el Short de la Clave (si hubo)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY2: ${{ secrets.AZURE_SPEECH_KEY2 }}
          AZURE_SPEECH_REGION2: ${{ secrets.AZURE_SPEECH_REGION2 }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: |
          if [ -f "out/$FECHA/$FECHA-clave.mp4" ]; then node scripts/short.js --fecha "$FECHA" --clave --voz --render; else echo "Sin Clave hoy: no hay Short de la Clave."; fi

      - name: 5 · Commit de las descripciones
        if: env.SALTAR != '1'
        run: |
          git add contenido/descripciones/ || true
          git diff --cached --quiet || { git commit -m "descripciones $FECHA [bot]"; git pull --rebase; git push; }

      - name: 6 · Publicar videos como release del día
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.SALTAR != '1'
        run: |
          TAG="edicion-$FECHA"
          NOTAS="contenido/descripciones/$FECHA-informe.txt"
          [ -f "$NOTAS" ] || { echo "(sin descripción, release con notas mínimas)"; echo "Edición $FECHA" > "$NOTAS"; }
          gh release create "$TAG" --title "Edición $FECHA" --notes-file "$NOTAS" \
            || echo "release ya existía, subiendo archivos"
          gh release upload "$TAG" out/$FECHA/*.mp4 --clobber
          if ls public/$FECHA-*.mp3 >/dev/null 2>&1; then gh release upload "$TAG" public/$FECHA-*.mp3 --clobber; fi

      # Sube el informe a YouTube como PRIVADO si existen los tres secrets
      # (docs/youtube.md). Sin secrets no hace nada y no falla. Publicar sigue
      # siendo un clic humano en YouTube Studio.
      - name: 7 · Subir a YouTube (privado; solo si hay secrets)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Variable del repo (Settings → Variables), ej. "07:30": publica solo a esa
          # hora de Chile. Solo sirve tras la auditoría de la API; vacía = privado.
          YT_PUBLICAR_HORA: ${{ vars.YT_PUBLICAR_HORA }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: |
          node scripts/youtube-subir.js --fecha "$FECHA"
          if [ -f "out/$FECHA/$FECHA-short.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --short; fi
          if [ -f "out/$FECHA/$FECHA-clave.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --clave; fi
          if [ -f "out/$FECHA/$FECHA-short-clave.mp4" ]; then node scripts/youtube-subir.js --fecha "$FECHA" --short --clave; fi

      # El informe como episodio de podcast (Spotify y compañía leen el RSS solos).
      # Necesita el secret AUDIO_TOKEN (PAT fino con contents:write sobre
      # entender-chile-web); sin él, avisa y sigue.
      - name: 7b · Episodio del podcast (si hay AUDIO_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.AUDIO_TOKEN }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Sin AUDIO_TOKEN: no hay episodio de podcast."; exit 0; fi
          node scripts/podcast-subir.js --fecha "$FECHA"
          if [ -f "public/$FECHA-clave.mp3" ]; then node scripts/podcast-subir.js --fecha "$FECHA" --clave; fi
          git config user.name "edicion-bot"; git config user.email "bot@users.noreply.github.com"
          git add contenido/podcast/ && { git diff --cached --quiet || { git commit -m "podcast $FECHA [bot]"; git pull --rebase; git push; }; }

      # Los pushes hechos con el token del workflow NO disparan otros workflows
      # (regla anti-recursión de GitHub): el feed del podcast quedaba viejo
      # (hallazgo de la sesión de día, 31-08). Se despacha la web a mano.
      - name: 8 · Reconstruir la web (los pushes del bot no disparan workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.SALTAR != '1'
        continue-on-error: true
        run: gh workflow run web.yml --ref main

name: Estado del día

# Escribe la VISTA del estado (contenido/estado/FECHA.md y .json) en el repo,
# que es lo que faltaba del paso 1 de la máquina de estados
# (bitacora/2026-09-08-propuesta-maquina-de-estados.md, §7 y §8). Hasta hoy el
# estado solo se calculaba al vuelo: el vigía lo leía con --solo-leer y nadie
# más podía verlo, así que GPT no tenía cómo saber en qué va el día.
#
# Se recalcula CADA VEZ QUE LLEGA UNA PIEZA, que es exactamente cuando el
# estado cambia. La regla que manda acá: un estado viejo commiteado es peor
# que ninguno.
#
# Y no se commitea cuando lo único que cambió es la marca de hora. Si no, cada
# push de contenido dejaría un commit sin información y despertaría por nada a
# las rutinas de Claude que escuchan el repo.
on:
  push:
    branches: [main]
    paths:
      - "contenido/barrido/**"
      - "contenido/preseleccion/**"
      - "contenido/informes/**"
      - "contenido/claves/**"
      - "contenido/guiones/**"
      - "contenido/revisiones/**"
      # los veredictos por pieza del validador (v3): son los que mueven la
      # etapa entre pieza y pieza. Sin esta ruta, el 15-09 la cadena se congeló
      # a las 01:44 y solo avanzó cuando el reloj del barrido recalculó de paso.
      - "contenido/veredictos/**"
      - "contenido/descripciones/**"
  # Los pushes hechos por Actions con GITHUB_TOKEN NO disparan workflows (regla
  # de GitHub). El barrido y la edición diaria commitean así, como edicion-bot,
  # de modo que el disparador de arriba es CIEGO justo para la primera pieza del
  # día y para la última. Sin esto, la 01:34 pasaba sin que el estado se
  # recalculara y el despachador de GPT nunca despertaba con barrido_listo.
  workflow_run:
    workflows: ["Barrido", "Edición diaria"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # si el workflow que nos despertó falló, no hay pieza nueva que reflejar
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # historia completa: la columna "Llegó" de la vista sale de
          # `git log --diff-filter=A` por archivo. Con el checkout shallow que
          # trae Actions por defecto, ese log no existe y todas las piezas
          # salían con la hora del checkout (probado: las ocho marcaron 19:15).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calcular el estado del día
        run: node scripts/estado.js
      - name: Commit, solo si el estado cambió de verdad
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          git config user.name "estado-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/estado/
          git diff --cached --quiet && { echo "sin cambios en el estado"; exit 0; }
          # ¿cambió algo más que la marca de hora?
          UTIL=$(git diff --cached -U0 -- contenido/estado/ \
                 | grep -E "^[+-][^+-]" \
                 | grep -vE "^[+-](ACTUALIZADO:|[[:space:]]*\"actualizado\":)" \
                 | wc -l)
          if [ "$UTIL" -eq 0 ]; then
            git reset -q
            echo "solo cambió la marca de hora: no se commitea"
            exit 0
          fi
          ETAPA=$(grep -m1 '^ETAPA:' "contenido/estado/$FECHA.md" | cut -d' ' -f2-)
          git commit -m "estado $FECHA: $ETAPA [bot]"
          git -c rebase.autoStash=true pull --rebase origin main
          git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }

      - name: Emitir el evento al PR único del estado (es quien despierta a GPT) y, por API, a Claude
        env:
          GH_TOKEN: ${{ github.token }}
          # Camino B del diseño (doc: code.claude.com/docs/en/routines): despertar
          # DIRIGIDO a la rutina de Claude por su endpoint /fire. Sin estos secrets
          # el paso no hace nada y los relojes de 02:20 y 04:45 siguen mandando.
          REVISION_ID: ${{ secrets.CLAUDE_RUTINA_REVISION_ID }}
          REVISION_TOKEN: ${{ secrets.CLAUDE_RUTINA_REVISION_TOKEN }}
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          VISTA="contenido/estado/$FECHA.md"
          [ -f "$VISTA" ] || { echo "sin vista del estado: sin evento"; exit 0; }
          ETAPA=$(grep -m1 '^ETAPA:' "$VISTA" | cut -d' ' -f2-)
          VUELTA=$(grep -m1 '^VUELTA:' "$VISTA" | cut -d' ' -f2-); VUELTA=${VUELTA:-0}
          REPARAR=$(grep -m1 '^REPARAR:' "$VISTA" | cut -d' ' -f2- || true)
          git fetch origin main
          # dedup por fecha, etapa Y vuelta: el día tiene varias etapas y cada
          # una necesita su aviso; y con el bucle de corrección la misma etapa
          # (guiones_listos, reparar) vuelve a ocurrir en cada vuelta y hay que
          # volver a avisar. La misma etapa de la misma vuelta no se anuncia dos veces.
          if git fetch origin automatizacion/estado 2>/dev/null; then
            EV=$(git show FETCH_HEAD:contenido/estado/ultimo-evento.txt 2>/dev/null || echo "")
            if echo "$EV" | grep -q "fecha_chile=$FECHA" && echo "$EV" | grep -q "^etapa=$ETAPA$" && echo "$EV" | grep -q "^vuelta=$VUELTA$"; then
              echo "el evento de la etapa $ETAPA (vuelta $VUELTA) ya se emitió hoy"
              exit 0
            fi
          fi
          SHA=$(git log -1 --format=%h origin/main)
          git checkout -B automatizacion/estado origin/main
          {
            echo "fecha_chile=$FECHA"
            echo "etapa=$ETAPA"
            echo "vuelta=$VUELTA"
            echo "reparar=$REPARAR"
            echo "pieza=$(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2- || true)"
            echo "prompt=$(grep -m1 '^PROMPT:' "$VISTA" | cut -d' ' -f2- || true)"
            echo "estado_commit=$SHA"
            echo "vista=$VISTA"
            echo "emitido_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > contenido/estado/ultimo-evento.txt
          git add contenido/estado/ultimo-evento.txt
          git commit -m "evento $FECHA: estado $ETAPA (vuelta $VUELTA)"
          git push -f origin automatizacion/estado

          # Despertar dirigido a Claude. Solo con etapa de Claude, solo si hay
          # secrets, y solo cuando el evento es NUEVO (el dedup de arriba ya
          # hizo salir a esta corrida si la etapa se había anunciado). Nunca
          # falla el job: si el /fire no responde 2xx, avisa y los relojes de
          # 02:20 y 04:45 hacen el trabajo como hasta ahora.
          # Cadena lineal v3 (15-09): cada pieza de GPT se valida antes de la
          # siguiente. Toda etapa validar_<pieza> (y validar_final) es turno de
          # Claude: se dispara la rutina validadora, que hoy es la misma de las
          # 02:20 (su reloj queda de red).
          case "$ETAPA" in
            validar_*) RUTINA_ID="$REVISION_ID"; RUTINA_TOKEN="$REVISION_TOKEN"; QUE="validación de la pieza $(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2-)" ;;
            *) RUTINA_ID=""; RUTINA_TOKEN=""; QUE="" ;;
          esac
          if [ -n "$RUTINA_ID" ] && [ -n "$RUTINA_TOKEN" ]; then
            BODY=$(printf '{"text":"Entender Chile, %s: etapa %s, vuelta %s. Te toca la %s. Este texto solo te despierta: la verdad son los archivos del repo y tus guardas del punto 0 se aplican igual."}' "$FECHA" "$ETAPA" "$VUELTA" "$QUE")
            CODIGO=$(curl -sS -o /tmp/fire.json -w '%{http_code}' -X POST \
              "https://api.anthropic.com/v1/claude_code/routines/$RUTINA_ID/fire" \
              -H "Authorization: Bearer $RUTINA_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "$BODY" || echo 000)
            case "$CODIGO" in
              2*) echo "Claude despertado por API para $ETAPA: $(head -c 300 /tmp/fire.json)" ;;
              *) echo "::warning::no se pudo despertar a Claude por API (HTTP $CODIGO); los relojes de 02:20 y 04:45 lo cubren" ;;
            esac
          elif echo "$ETAPA" | grep -q '^validar_'; then
            echo "sin secrets CLAUDE_RUTINA_REVISION_*: al validador lo despierta su reloj de las 02:20"
          fi
          gh pr list --head automatizacion/estado --state open --json number -q '.[0].number' | grep -q . \
            || gh pr create --base main --head automatizacion/estado \
                 --title "🔔 Estado del día — disparador único de GPT (no fusionar)" \
                 --body "PR permanente. No se fusiona: cada commit nuevo aquí anuncia que la edición del día cambió de etapa (ver contenido/estado/ultimo-evento.txt, y la vista completa en contenido/estado/FECHA.md). Es el disparador único de la tarea de contenido de ChatGPT, que decide qué hacer leyendo el estado, no el evento. Diseño: bitacora/2026-09-08-propuesta-maquina-de-estados.md y prompts/despachador-gpt.md."

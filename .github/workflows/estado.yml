name: Estado del día

# Escribe la VISTA del estado (contenido/estado/FECHA.md y .json) en el repo,
# que es lo que faltaba del paso 1 de la máquina de estados
# (bitacora/2026-09-08-propuesta-maquina-de-estados.md, §7 y §8). Hasta hoy el
# estado solo se calculaba al vuelo: el vigía lo leía con --solo-leer y nadie
# más podía verlo, así que GPT no tenía cómo saber en qué va el día.
#
# Se recalcula CADA VEZ QUE LLEGA UNA PIEZA, que es exactamente cuando el
# estado cambia. La regla que manda acá: un estado viejo commiteado es peor
# que ninguno.
#
# Y no se commitea cuando lo único que cambió es la marca de hora. Si no, cada
# push de contenido dejaría un commit sin información y despertaría por nada a
# las rutinas de Claude que escuchan el repo.
on:
  push:
    branches: [main]
    paths:
      - "contenido/barrido/**"
      - "contenido/preseleccion/**"
      - "contenido/informes/**"
      - "contenido/claves/**"
      - "contenido/guiones/**"
      - "contenido/revisiones/**"
      # los veredictos por pieza del validador (v3): son los que mueven la
      # etapa entre pieza y pieza. Sin esta ruta, el 15-09 la cadena se congeló
      # a las 01:44 y solo avanzó cuando el reloj del barrido recalculó de paso.
      - "contenido/veredictos/**"
      - "contenido/descripciones/**"
  # Los pushes hechos por Actions con GITHUB_TOKEN NO disparan workflows (regla
  # de GitHub). El barrido y la edición diaria commitean así, como edicion-bot,
  # de modo que el disparador de arriba es CIEGO justo para la primera pieza del
  # día y para la última. Sin esto, la 01:34 pasaba sin que el estado se
  # recalculara y el despachador de GPT nunca despertaba con barrido_listo.
  workflow_run:
    workflows: ["Barrido", "Edición diaria"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # si el workflow que nos despertó falló, no hay pieza nueva que reflejar
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # historia completa: la columna "Llegó" de la vista sale de
          # `git log --diff-filter=A` por archivo. Con el checkout shallow que
          # trae Actions por defecto, ese log no existe y todas las piezas
          # salían con la hora del checkout (probado: las ocho marcaron 19:15).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calcular el estado del día
        run: node scripts/estado.js
      - name: Commit, solo si el estado cambió de verdad
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          git config user.name "estado-bot"
          git config user.email "bot@users.noreply.github.com"
          # El estado es una función de los archivos: si otro push llegó
          # mientras calculábamos, NO se rebasea (el 15-09 dos corridas a
          # cuatro segundos chocaron en el JSON y la segunda murió sin emitir
          # ni despertar a Claude). Se vuelve a main fresco, se recalcula y se
          # reintenta, hasta tres veces.
          for intento in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/estado.js
            git add contenido/estado/
            git diff --cached --quiet && { echo "sin cambios en el estado"; exit 0; }
            # ¿cambió algo más que la marca de hora?
            UTIL=$(git diff --cached -U0 -- contenido/estado/ \
                   | grep -E "^[+-][^+-]" \
                   | grep -vE "^[+-](ACTUALIZADO:|[[:space:]]*\"actualizado\":)" \
                   | wc -l)
            if [ "$UTIL" -eq 0 ]; then
              git reset -q
              echo "solo cambió la marca de hora: no se commitea"
              exit 0
            fi
            ETAPA=$(grep -m1 '^ETAPA:' "contenido/estado/$FECHA.md" | cut -d' ' -f2-)
            git commit -q -m "estado $FECHA: $ETAPA [bot]"
            if git push -q origin main; then echo "estado commiteado: $ETAPA (intento $intento)"; break; fi
            echo "push rechazado (intento $intento de 3): main cambió, recalculo encima"
            [ "$intento" = 3 ] && { echo "::error::no se pudo commitear el estado tras tres intentos"; exit 1; }
          done

      - name: Emitir el evento al PR único del estado (es quien despierta a GPT) y, por API, a Claude
        env:
          GH_TOKEN: ${{ github.token }}
          # Camino B del diseño (doc: code.claude.com/docs/en/routines): despertar
          # DIRIGIDO a la rutina de Claude por su endpoint /fire. Sin estos secrets
          # el paso no hace nada y los relojes de 02:20 y 04:45 siguen mandando.
          REVISION_ID: ${{ secrets.CLAUDE_RUTINA_REVISION_ID }}
          REVISION_TOKEN: ${{ secrets.CLAUDE_RUTINA_REVISION_TOKEN }}
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          VISTA="contenido/estado/$FECHA.md"
          [ -f "$VISTA" ] || { echo "sin vista del estado: sin evento"; exit 0; }
          ETAPA=$(grep -m1 '^ETAPA:' "$VISTA" | cut -d' ' -f2-)
          VUELTA=$(grep -m1 '^VUELTA:' "$VISTA" | cut -d' ' -f2-); VUELTA=${VUELTA:-0}
          REPARAR=$(grep -m1 '^REPARAR:' "$VISTA" | cut -d' ' -f2- || true)
          git fetch origin main
          # El PR #6 se toca SOLO en turnos de GPT (escribir o corregir). Las
          # etapas validar_* son de Claude, que se despierta por API más abajo;
          # emitirlas al PR despertaba al despachador solo para que esperara
          # (15-09: 11 de 20 eventos fueron eso, y la cuota de ChatGPT se agotó
          # a media cadena). aprobada, videos_listos, bloqueado_humano y
          # nuevo_dia tampoco son de GPT.
          EMITIR=1
          echo "$ETAPA" | grep -Eq '^(barrido_listo|[a-z_]+_lista|[a-z_]+_listo|reparar_[a-z_]+)$' \
            || { echo "etapa $ETAPA no es turno de GPT: no se toca el PR #6"; EMITIR=0; }
          # dedup por fecha, etapa Y vuelta: el día tiene varias etapas y cada
          # una necesita su aviso; y con el bucle de corrección la misma etapa
          # (reparar) vuelve a ocurrir en cada vuelta y hay que volver a avisar.
          # La misma etapa de la misma vuelta no se anuncia dos veces.
          if [ "$EMITIR" = 1 ] && git fetch origin automatizacion/estado 2>/dev/null; then
            EV=$(git show FETCH_HEAD:contenido/estado/ultimo-evento.txt 2>/dev/null || echo "")
            if echo "$EV" | grep -q "fecha_chile=$FECHA" && echo "$EV" | grep -q "^etapa=$ETAPA$" && echo "$EV" | grep -q "^vuelta=$VUELTA$"; then
              echo "el evento de la etapa $ETAPA (vuelta $VUELTA) ya se emitió hoy"
              EMITIR=0
            fi
          fi
          if [ "$EMITIR" = 1 ]; then
            SHA=$(git log -1 --format=%h origin/main)
            git checkout -B automatizacion/estado origin/main
            # el flujo de la Clave deja su propio evento en la misma rama
            # (ultimo-evento-clave.txt, estado-clave.yml): al resetear la rama a
            # main hay que conservarlo, o cada emisión diaria lo borraría y el
            # despachador volvería a despertar por la Clave sin motivo (21-09)
            git show origin/automatizacion/estado:contenido/estado/ultimo-evento-clave.txt > contenido/estado/ultimo-evento-clave.txt 2>/dev/null \
              && git add contenido/estado/ultimo-evento-clave.txt || rm -f contenido/estado/ultimo-evento-clave.txt
            # lo mismo con el evento de los pedidos a GPT (pedido-gpt.yml, 23-09)
            git show origin/automatizacion/estado:contenido/estado/ultimo-evento-pedido.txt > contenido/estado/ultimo-evento-pedido.txt 2>/dev/null \
              && git add contenido/estado/ultimo-evento-pedido.txt || rm -f contenido/estado/ultimo-evento-pedido.txt
            {
              echo "fecha_chile=$FECHA"
              echo "etapa=$ETAPA"
              echo "vuelta=$VUELTA"
              echo "reparar=$REPARAR"
              echo "pieza=$(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2- || true)"
              echo "prompt=$(grep -m1 '^PROMPT:' "$VISTA" | cut -d' ' -f2- || true)"
              echo "estado_commit=$SHA"
              echo "vista=$VISTA"
              echo "emitido_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > contenido/estado/ultimo-evento.txt
            git add contenido/estado/ultimo-evento.txt
            git commit -m "evento $FECHA: estado $ETAPA (vuelta $VUELTA)"
            git push -f origin automatizacion/estado
            git checkout -q main 2>/dev/null || true
          fi

          # Despertar dirigido a Claude. Solo con etapa de Claude, solo si hay
          # secrets, y solo una vez por etapa y vuelta: como las validar_* ya
          # no pasan por el PR #6, su dedup vive en main, en
          # contenido/estado/ultimo-disparo-claude.txt (un recálculo repetido
          # en la misma etapa, por ejemplo el reloj del barrido, no vuelve a
          # disparar). Nunca falla el job: si el /fire no responde 2xx, avisa
          # y los relojes de 02:20 y 04:45 hacen el trabajo como hasta ahora.
          MARCA="contenido/estado/ultimo-disparo-claude.txt"
          if echo "$ETAPA" | grep -q '^validar_'; then
            YA=$(git show origin/main:"$MARCA" 2>/dev/null || echo "")
            if [ "$YA" = "$FECHA $ETAPA $VUELTA" ]; then
              echo "Claude ya fue despertado para $ETAPA (vuelta $VUELTA): no se repite"
              ETAPA_DISPARO=""
            else
              ETAPA_DISPARO="$ETAPA"
              git checkout -q main 2>/dev/null || true
              for intento in 1 2 3; do
                git fetch -q origin main && git reset -q --hard origin/main
                YA=$(cat "$MARCA" 2>/dev/null || echo "")
                if [ "$YA" = "$FECHA $ETAPA $VUELTA" ]; then echo "otra corrida ya dejó la marca: no se repite el disparo"; ETAPA_DISPARO=""; break; fi
                echo "$FECHA $ETAPA $VUELTA" > "$MARCA"
                git add "$MARCA"
                git commit -q -m "disparo a Claude $FECHA: $ETAPA (vuelta $VUELTA) [bot]"
                git push -q origin main && break
                echo "push de la marca rechazado (intento $intento de 3)"
                [ "$intento" = 3 ] && { echo "::warning::no se pudo dejar la marca; se dispara igual"; }
              done
            fi
          else
            ETAPA_DISPARO=""
          fi
          # Cadena lineal v3 (15-09): cada pieza de GPT se valida antes de la
          # siguiente. Toda etapa validar_<pieza> (y validar_final) es turno de
          # Claude: se dispara la rutina validadora, que hoy es la misma de las
          # 02:20 (su reloj queda de red).
          case "$ETAPA_DISPARO" in
            validar_*) RUTINA_ID="$REVISION_ID"; RUTINA_TOKEN="$REVISION_TOKEN"; QUE="validación de la pieza $(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2-)" ;;
            *) RUTINA_ID=""; RUTINA_TOKEN=""; QUE="" ;;
          esac
          if [ -n "$RUTINA_ID" ] && [ -n "$RUTINA_TOKEN" ]; then
            BODY=$(printf '{"text":"Entender Chile, %s: etapa %s, vuelta %s. Te toca la %s. Este texto solo te despierta: la verdad son los archivos del repo y tus guardas del punto 0 se aplican igual."}' "$FECHA" "$ETAPA" "$VUELTA" "$QUE")
            CODIGO=$(curl -sS -o /tmp/fire.json -w '%{http_code}' -X POST \
              "https://api.anthropic.com/v1/claude_code/routines/$RUTINA_ID/fire" \
              -H "Authorization: Bearer $RUTINA_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "$BODY" || echo 000)
            case "$CODIGO" in
              2*) echo "Claude despertado por API para $ETAPA: $(head -c 300 /tmp/fire.json)" ;;
              *) echo "::warning::no se pudo despertar a Claude por API (HTTP $CODIGO); los relojes de 02:20 y 04:45 lo cubren" ;;
            esac
          elif echo "$ETAPA_DISPARO" | grep -q '^validar_'; then
            echo "sin secrets CLAUDE_RUTINA_REVISION_*: al validador lo despierta su reloj de las 02:20"
          fi

          # PLAN B (26-09): mientras contenido/estado/plan-b.txt tenga `hasta:`
          # vigente, GPT no está. Las etapas de su línea `turnos:` (el * es
          # comodín) despiertan por API a la rutina validadora en MODO SUPLENTE
          # (prompts/suplente.md), una vez por etapa y vuelta. La lista vive SOLO
          # en ese archivo: aquí no se repite.
          # Ese archivo NO se escribe acá: lo escribe reintento.yml cuando GPT
          # se saltó dos avisos seguidos (regla 20 y 20), o una persona a mano
          # con el mismo formato. Con la línea `turnos:` completa que deja
          # reintento.yml, el suplente cubre todos los turnos del día. Se apaga
          # borrando el archivo; si nadie lo borra, al día siguiente vence y lo
          # borra el propio reintento.yml.
          PLANB=$(grep -m1 '^hasta:' contenido/estado/plan-b.txt 2>/dev/null | cut -d' ' -f2- || true)
          TURNOS=$(grep -m1 '^turnos:' contenido/estado/plan-b.txt 2>/dev/null | cut -d' ' -f2- || true)
          RE_T="^($(echo "$TURNOS" | sed 's/\*/[a-z_]+/g; s/  */|/g'))$"
          if [ -n "$PLANB" ] && [ -n "$TURNOS" ] && [ "$PLANB" \> "$FECHA" -o "$PLANB" = "$FECHA" ] \
             && echo "$ETAPA" | grep -Eq "$RE_T" \
             && [ -n "$REVISION_ID" ] && [ -n "$REVISION_TOKEN" ]; then
            MARCA_S="contenido/estado/ultimo-disparo-suplente.txt"
            git checkout -q main 2>/dev/null || true; git fetch -q origin main && git reset -q --hard origin/main
            if [ "$(cat "$MARCA_S" 2>/dev/null)" = "$FECHA $ETAPA $VUELTA" ]; then echo "suplente ya despertado para $ETAPA (vuelta $VUELTA)"; else
              echo "$FECHA $ETAPA $VUELTA" > "$MARCA_S"; git add "$MARCA_S"; git commit -q -m "disparo al suplente $FECHA: $ETAPA (vuelta $VUELTA) [bot]"; git push -q origin main || echo "::warning::marca del suplente no pusheada; se dispara igual"
              BODY=$(printf '{"text":"Entender Chile, PLAN B (GPT sin cuota, contenido/estado/plan-b.txt): %s, etapa %s, vuelta %s. Haz el turno de GPT como SUPLENTE segun prompts/suplente.md. La verdad es contenido/estado/%s.md."}' "$FECHA" "$ETAPA" "$VUELTA" "$FECHA")
              CODIGO=$(curl -sS -o /tmp/fire-s.json -w '%{http_code}' -X POST "https://api.anthropic.com/v1/claude_code/routines/$REVISION_ID/fire" \
                -H "Authorization: Bearer $REVISION_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$BODY" || echo 000)
              case "$CODIGO" in 2*) echo "SUPLENTE despertado por API para $ETAPA: $(head -c 200 /tmp/fire-s.json)";; *) echo "::warning::no se pudo despertar al suplente (HTTP $CODIGO)";; esac
            fi
          fi
          # AVISO a Santiago (27-09): bloqueado_humano es la única etapa del día
          # que NO se destraba sola. La pone el validador al agotar el tope de
          # vueltas, y hasta ahora solo se veía entrando al repo o al Taller: la
          # cadena quedaba muerta con la publicación acercándose. Se despierta la
          # misma rutina, que en MODO AVISADOR (prompts/validador.md, punto 0)
          # comprueba bitacora/bandeja.json y manda UNA notificación push. Marca
          # propia (ultimo-aviso.txt) para no pisar el dedup del validador ni el
          # del suplente: las tres cosas pueden pasar el mismo día.
          if [ "$ETAPA" = "bloqueado_humano" ] && [ -n "$REVISION_ID" ] && [ -n "$REVISION_TOKEN" ]; then
            MARCA_A="contenido/estado/ultimo-aviso.txt"
            git checkout -q main 2>/dev/null || true; git fetch -q origin main && git reset -q --hard origin/main
            if [ "$(cat "$MARCA_A" 2>/dev/null)" = "$FECHA $ETAPA $VUELTA" ]; then echo "aviso ya enviado para $ETAPA (vuelta $VUELTA)"; else
              echo "$FECHA $ETAPA $VUELTA" > "$MARCA_A"; git add "$MARCA_A"; git commit -q -m "aviso a Santiago $FECHA: $ETAPA (vuelta $VUELTA) [bot]"; git push -q origin main || echo "::warning::marca del aviso no pusheada; se avisa igual"
              BODY=$(printf '{"text":"AVISO a Santiago: la edicion del %s quedo BLOQUEADA en la pieza %s (vuelta %s) y no avanza sin el. Estas en MODO AVISADOR (prompts/validador.md, punto 0): comprueba bitacora/bandeja.json y manda UNA notificacion push."}' "$FECHA" "$(grep -m1 '^PIEZA:' "$VISTA" | cut -d' ' -f2-)" "$VUELTA")
              CODIGO=$(curl -sS -o /tmp/fire-a.json -w '%{http_code}' -X POST "https://api.anthropic.com/v1/claude_code/routines/$REVISION_ID/fire" \
                -H "Authorization: Bearer $REVISION_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$BODY" || echo 000)
              case "$CODIGO" in 2*) echo "AVISO disparado: $(head -c 200 /tmp/fire-a.json)";; *) echo "::warning::no se pudo disparar el aviso (HTTP $CODIGO); el Taller y el informe de la mañana lo muestran igual";; esac
            fi
          fi

          gh pr list --head automatizacion/estado --state open --json number -q '.[0].number' | grep -q . \
            || gh pr create --base main --head automatizacion/estado \
                 --title "🔔 Estado del día — disparador único de GPT (no fusionar)" \
                 --body "PR permanente. No se fusiona: cada commit nuevo aquí anuncia que la edición del día cambió de etapa (ver contenido/estado/ultimo-evento.txt, y la vista completa en contenido/estado/FECHA.md). Es el disparador único de la tarea de contenido de ChatGPT, que decide qué hacer leyendo el estado, no el evento. Diseño: bitacora/2026-09-08-propuesta-maquina-de-estados.md y prompts/despachador-gpt.md."

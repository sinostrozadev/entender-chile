name: Barrido

# Junta lo que publicó la prensa chilena y lo deja en contenido/barrido/.
#
# Historia de los relojes (rutina, dos crons, relanzado por reintento.yml y
# el recálculo del estado): ver este archivo en git antes del 13-11-2026.
#
# RELOJ (13-11-2026, Estrategia A, docs/FLUJO.md): UN solo reloj, este cron.
# El barrido ya no despierta a nadie a una hora fija: es el banco de temas que
# lee el plan semanal del jueves, así que llegar tarde no cuesta nada. La
# rutina "Reloj del barrido" se apaga. --si-falta impide un barrido doble.
on:
  schedule:
    - cron: "50 4 * * *"   # 01:50 de Chile en verano
  workflow_dispatch:
    inputs:
      forzar:
        description: "Regenerar aunque el barrido de hoy ya exista"
        type: boolean
        default: false

# El commit del barrido escribe en main. La limpieza del 13-11 borró este bloque junto con los permisos del
# canal de avisos, y desde la primera corrida tras fusionar (19-11) el push daba 403.
permissions:
  contents: write

concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Barrer
        run: node scripts/barrido.js ${{ inputs.forzar == true && ' ' || '--si-falta' }}

      - name: Commit del barrido
        run: |
          FECHA=$(TZ=America/Santiago date +%F)
          git config user.name "edicion-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/barrido/
          git diff --cached --quiet || {
            git commit -m "barrido $FECHA [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

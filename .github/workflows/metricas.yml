name: Métricas

# Cada mañana baja las cifras del canal al repo: bitacora/metricas/FECHA.md
# (+json para los deltas). El análisis lo hace la sesión de la mañana.
#
# RELOJ (regla del 31-08: el cron de GitHub no es reloj principal — nunca
# corrió solo): lo despierta la rutina "Reloj de métricas" de Claude en la
# nube (12:45 UTC = 08:45/09:45 Chile) pusheando el despertador; el cron
# queda solo de red de respaldo.
on:
  push:
    branches: [main]
    paths:
      - "bitacora/metricas/despertador.txt"
  schedule:
    # dos entradas: el 03-09 el reloj de Claude murió por cuota y el cron
    # único es poco confiable (patrón ya aplicado en barrido.yml)
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar solo googleapis (npm ci entero tarda y no hace falta)
        run: npm install --no-save googleapis
      # IMPRESIONES DE CARÁTULA (23-09): van antes que las métricas porque el
      # reporte de la mañana las lee del archivo que deja este paso. La
      # Reporting API entrega un CSV por día; el script crea el trabajo la
      # primera vez y después solo baja los días que faltan. Si falla, las
      # métricas se bajan igual.
      - name: Impresiones de carátula (Reporting API)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        continue-on-error: true
        run: node scripts/impresiones.js

      - name: Bajar métricas
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: node scripts/metricas.js
      - name: Refrescar cronograma y taller en el panel
        run: node scripts/panel-cronograma.js
      - name: Commit
        run: |
          git config user.name "metricas-bot"
          git config user.email "bot@users.noreply.github.com"
          # metricas.js escribe en bitacora/metricas/ Y refresca el gráfico dentro
          # de bitacora/panel-interno.html. Si el panel queda sin preparar, el
          # rebase aborta con "cannot pull with rebase: You have unstaged changes"
          # y la medición del día se pierde (pasó dos veces el 01-09).
          git add bitacora/metricas/ bitacora/panel-interno.html
          git diff --cached --quiet || {
            git commit -m "métricas $(TZ=America/Santiago date +%F) [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

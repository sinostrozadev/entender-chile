# PASO 2 del flujo de Entender Chile (docs/FLUJO.md): render y subida programada.
#
# Sin reloj: lo dispara el push del plan semanal (contenido/semana/**) y la llegada de una carátula de GPT
# (contenido/caratulas/listas/**). La cadena vieja necesitaba relojes y reintentos porque esperaba a GPT en tiempo
# real; acá el guion ya está escrito y verificado cuando llega el push. Cada pieza deja su marca en
# contenido/semana/<semana>/hechos/: un segundo push no sube el mismo video dos veces.
# Molde: numeros-rojos/.github/workflows/producir.yml (un largo de 10 min rinde en ~12 min en Actions).
name: Producir

on:
  push:
    branches: [main]
    paths:
      - "contenido/semana/**/*.json"
      - "contenido/caratulas/listas/**"
  workflow_dispatch:
    inputs:
      semana:
        description: "Carpeta de la semana (AAAA-MM-DD, el jueves en que empieza). Vacío = todas con piezas pendientes"
        type: string
        default: ""
      solo:
        description: "Id de UNA pieza (ignora la regla de hora futura; para rehacer a mano)"
        type: string
        default: ""
      subir:
        description: "Subir a YouTube (false = solo renderizar y dejar el mp4 como artifact)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: producir
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: video
    env:
      VOZ_PROVEEDOR: edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Máquina
        run: |
          cpus=$(nproc); mem=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          if [ "$cpus" -ge 4 ] && [ "$mem" -ge 12000 ]; then conc=3; else conc=2; fi
          echo "EC_CONCURRENCIA=$conc" >> "$GITHUB_ENV"
          echo "CPU $cpus · RAM ${mem} MB · concurrency $conc"

      - name: Fuentes del sistema (emoji a color)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji > /dev/null

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Chrome headless de Remotion
        run: npx remotion browser ensure

      - name: Producir (validar, voz, render, subida programada)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SEMANA: ${{ inputs.semana }}
          SOLO: ${{ inputs.solo }}
          SUBIR: ${{ github.event_name == 'push' || inputs.subir }}
        run: |
          a=()
          [ -n "$SEMANA" ] && a+=(--semana "$SEMANA")
          [ -n "$SOLO" ] && a+=(--solo "$SOLO")
          [ "$SUBIR" = "true" ] || a+=(--sin-subir)
          npx tsx scripts/producir.mts --concurrencia "$EC_CONCURRENCIA" "${a[@]}"

      - name: Commit de las marcas de hecho
        if: always()
        working-directory: .
        run: |
          git config user.name "edicion-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido/semana/ || true
          git diff --cached --quiet || {
            git commit -m "producir: piezas programadas [bot]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }
          }

      - name: Videos como artifact (14 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: producir-${{ github.run_id }}
          path: video/salida/bandeja/*.mp4
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

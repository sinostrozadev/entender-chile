name: Prueba de flujo

# PRUEBA v2 (14-09-2026): el eslabón de Actions en el bucle
#   GPT escribe la pieza → aquí se despierta a Claude → Claude deja el
#   veredicto → aquí se emite el evento al PR #6 → GPT corrige o cierra.
# Prompts: prompts/prueba-flujo.md (GPT) y prompts/prueba-validador.md
# (Claude). Se puede borrar cuando la máquina v2 lo reemplace.
#
# Cómo se despierta a Claude: por la API de la rutina (doc de Routines:
# POST .../routines/ID/fire con el token de esa rutina), con los secrets
# CLAUDE_RUTINA_PRUEBA_ID y CLAUDE_RUTINA_PRUEBA_TOKEN. Sin los secrets, el
# workflow solo lo deja dicho en el log y a Claude hay que despertarlo a mano
# (etapa 1 de la prueba).
on:
  push:
    branches: [main]
    paths:
      - "contenido/pruebas/flujo/**"

permissions:
  contents: write

concurrency:
  group: prueba-flujo
  cancel-in-progress: false

jobs:
  eslabon:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decidir a quién le toca
        id: decidir
        run: |
          F=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^contenido/pruebas/flujo/.*\.md$' | head -1)
          [ -n "$F" ] && [ -f "$F" ] || { echo "el push no trae archivo de prueba"; exit 0; }
          echo "archivo: $F"
          case "$F" in
            *-pieza.md)
              FECHA=$(basename "$F" -pieza.md)
              if grep -q '^FIN:' "$F"; then echo "la pieza tiene FIN: prueba cerrada"; exit 0; fi
              VUELTA=$(grep -m1 '^VUELTA:' "$F" | tr -dc '0-9')
              echo "turno=claude" >> "$GITHUB_OUTPUT"
              echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
              echo "vuelta=$VUELTA" >> "$GITHUB_OUTPUT"
              echo "etapa=prueba_validar_v$VUELTA" >> "$GITHUB_OUTPUT"
              ;;
            *-veredicto.md)
              FECHA=$(basename "$F" -veredicto.md)
              V=$(grep -m1 '^VEREDICTO:' "$F" | awk '{print $2}')
              VUELTA=$(grep -m1 '^VUELTA:' "$F" | tr -dc '0-9')
              case "$V" in
                CORREGIR) ETAPA="prueba_corregir_v$VUELTA" ;;
                APROBADA) ETAPA="prueba_aprobada_v$VUELTA" ;;
                *) echo "veredicto ilegible: $V"; exit 0 ;;
              esac
              echo "turno=gpt" >> "$GITHUB_OUTPUT"
              echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
              echo "etapa=$ETAPA" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "archivo sin rol en la prueba v2: $F" ;;
          esac

      # Camino B (después): despertar a Claude por la API de la rutina. Solo
      # corre si existen los secrets; mientras no estén, el camino es el PR.
      - name: Despertar a Claude por la API (solo con secrets)
        if: steps.decidir.outputs.turno == 'claude'
        env:
          ID: ${{ secrets.CLAUDE_RUTINA_PRUEBA_ID }}
          TOKEN: ${{ secrets.CLAUDE_RUTINA_PRUEBA_TOKEN }}
          FECHA: ${{ steps.decidir.outputs.fecha }}
          VUELTA: ${{ steps.decidir.outputs.vuelta }}
        run: |
          if [ -z "$ID" ] || [ -z "$TOKEN" ]; then
            echo "sin secrets de la API: a Claude lo despierta el evento del PR #6"
            exit 0
          fi
          BODY=$(printf '{"text":"valida contenido/pruebas/flujo/%s-pieza.md (vuelta %s)"}' "$FECHA" "$VUELTA")
          CODIGO=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/$ID/fire" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "content-type: application/json" \
            -d "$BODY")
          echo "respuesta $CODIGO"; head -c 400 /tmp/resp.json; echo
          case "$CODIGO" in 2*) echo "Claude despertado";; *) echo "::error::no se pudo despertar a Claude ($CODIGO)"; exit 1;; esac

      # Camino A (ahora): el PR #6 despierta a los dos. Con la pieza se emite
      # prueba_validar_vN (turno de Claude, que lo escucha con un disparador
      # de GitHub filtrado por esta rama); con el veredicto, prueba_corregir_vN
      # o prueba_aprobada_vN (turno de GPT). Cada uno lee la etapa y, si no es
      # la suya, termina en segundos.
      - name: Emitir el evento al PR #6 (despierta a quien le toque)
        if: steps.decidir.outputs.etapa != ''
        env:
          ETAPA: ${{ steps.decidir.outputs.etapa }}
          FECHA: ${{ steps.decidir.outputs.fecha }}
        run: |
          # un "ensayo" (nombre que no es fecha) valida el lado de Claude sin despertar a GPT
          echo "$FECHA" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "ensayo $FECHA: no se emite evento"; exit 0; }
          git config user.name "estado-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          if git fetch origin automatizacion/estado 2>/dev/null; then
            EV=$(git show FETCH_HEAD:contenido/estado/ultimo-evento.txt 2>/dev/null || echo "")
            if echo "$EV" | grep -q "fecha_chile=$FECHA" && echo "$EV" | grep -q "etapa=$ETAPA"; then
              echo "el evento $ETAPA ya se emitió hoy"; exit 0
            fi
          fi
          SHA=$(git log -1 --format=%h origin/main)
          git checkout -B automatizacion/estado origin/main
          case "$ETAPA" in prueba_validar_*) VISTA="contenido/pruebas/flujo/$FECHA-pieza.md" ;; *) VISTA="contenido/pruebas/flujo/$FECHA-veredicto.md" ;; esac
          {
            echo "fecha_chile=$FECHA"
            echo "etapa=$ETAPA"
            echo "estado_commit=$SHA"
            echo "vista=$VISTA"
            echo "emitido_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > contenido/estado/ultimo-evento.txt
          git add contenido/estado/ultimo-evento.txt
          git commit -m "evento $FECHA: prueba de flujo, $ETAPA"
          git push -f origin automatizacion/estado
          echo "evento emitido: $ETAPA"
